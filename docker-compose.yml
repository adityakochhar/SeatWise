services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./server
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/seatwise
      JWT_SECRET: local-dev-secret-change-in-production
      CLIENT_ORIGIN: http://localhost:8080
      HOLD_MINUTES: 5
      TZ: Asia/Kolkata
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
